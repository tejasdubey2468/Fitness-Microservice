spring:
  application:
    name: api-gateway


  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:8080/realms/fitness-oauth2/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
      - id: user-service
        uri: lb://USER-SERVICE
        predicates:
           - Path=/users/**

      - id: activity-service
        uri: lb://ACTIVITY-SERVICE
        predicates:
          - Path=/activities/**

      - id: ai-service
        uri: lb://AI-SERVICE
        predicates:
          - Path=/recommendation/**



eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/